name: Verify attendance firmware
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test session policy
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/attendance_test.cpp -o /tmp/attendance-test
          /tmp/attendance-test
  esp32-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-arduino-cli@v2
      - name: Install pinned core and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.0.7 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "Adafruit Fingerprint Sensor Library@2.1.3" "Adafruit SSD1306@2.5.13" "Adafruit GFX Library@1.11.11" "Adafruit BusIO@1.16.2"
      - name: Compile ESP32 reference
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all firmware/fingerprint_attendance
